<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' file: data:; font-src 'self' data: file:; connect-src 'self';"
    />
    <title>Lumina</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        /* ── Accent ── */
        --color-lumina: #e94560;
        --color-lumina-dark: #c73a52;

        /* ── 3-Layer Depth (VS Code 2026 inspired) ── */
        --color-surface-0: #0e0e10; /* Workbench — canvas, deepest */
        --color-surface-1: #1e1e1e; /* Tools — sidebar, tool panel */
        --color-surface-2: #252526; /* Actions — header, status bar */
        --color-surface-3: #333333; /* Borders, dividers */
        --color-surface-4: #3c3c3c; /* Hover borders, active indicators */

        /* ── Text Hierarchy ── */
        --color-text-primary: #d4d4d4; /* Main content */
        --color-text-secondary: #969696; /* Body, descriptions */
        --color-text-muted: #6a6a6a; /* Labels, metadata */
        --color-text-dim: #4a4a4a; /* Disabled, very subtle */
      }
    </style>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body
    class="bg-surface-0 text-text-secondary h-screen flex flex-col overflow-hidden text-xs font-sans select-none p-1.5 gap-1.5"
  >
    <!-- Header -->
    <header
      class="card card-raised flex items-center px-3 h-8 flex-shrink-0 gap-2"
    >
      <h1 class="text-[0.85rem] text-lumina font-bold tracking-tight">
        Lumina
      </h1>
      <div class="flex gap-1.5 ml-auto items-center">
        <button class="btn" id="btn-import" data-i18n="header.import">
          <span class="flex items-center gap-1"
            ><i data-lucide="folder-open" class="w-3 h-3"></i> Import</span
          >
        </button>
        <span class="w-px h-4 bg-surface-3"></span>
        <button
          class="btn"
          id="btn-undo"
          disabled
          data-i18n-title="header.undo"
        >
          <i data-lucide="undo-2" class="w-3 h-3"></i>
        </button>
        <button
          class="btn"
          id="btn-redo"
          disabled
          data-i18n-title="header.redo"
        >
          <i data-lucide="redo-2" class="w-3 h-3"></i>
        </button>
        <button class="btn" id="btn-settings" data-i18n-title="settings.title">
          <i data-lucide="settings" class="w-3 h-3"></i>
        </button>
        <div class="relative">
          <button
            class="btn flex items-center gap-1"
            id="btn-lang"
            data-i18n-title="settings.language"
          >
            <i data-lucide="globe" class="w-3 h-3"></i>
            <span id="lang-current">EN</span>
            <i data-lucide="chevron-down" class="w-2.5 h-2.5 opacity-50"></i>
          </button>
          <div
            id="lang-dropdown"
            class="hidden absolute top-full right-0 mt-1 bg-surface-1 border border-surface-3 rounded shadow-lg z-50 overflow-hidden"
          >
            <button class="lang-opt" data-lang="en">English</button>
            <button class="lang-opt" data-lang="id">Bahasa Indonesia</button>
          </div>
        </div>
        <button
          class="btn"
          id="btn-models"
          hidden
          data-i18n-title="models.openShortcut"
        >
          <i data-lucide="alert-triangle" class="w-3 h-3 text-[#ffb74d]"></i>
        </button>
        <button class="btn primary" id="btn-detect" disabled>
          <span class="flex items-center gap-1"
            ><i data-lucide="scan" class="w-3 h-3"></i>
            <span data-i18n="header.detect">Detect</span></span
          >
        </button>
        <button class="btn primary" id="btn-ocr" disabled>
          <span class="flex items-center gap-1"
            ><i data-lucide="scan-text" class="w-3 h-3"></i>
            <span data-i18n="header.ocr">OCR</span></span
          >
        </button>
        <button class="btn primary" id="btn-translate" disabled>
          <span class="flex items-center gap-1"
            ><i data-lucide="languages" class="w-3 h-3"></i>
            <span data-i18n="header.translate">Translate</span></span
          >
        </button>
        <button class="btn primary" id="btn-inpaint" disabled>
          <span class="flex items-center gap-1"
            ><i data-lucide="eraser" class="w-3 h-3"></i>
            <span data-i18n="header.inpaint">Inpaint</span></span
          >
        </button>
        <button
          class="btn"
          id="btn-toggle-boxes"
          disabled
          data-i18n-title="header.toggleBoxes"
        >
          <i data-lucide="eye" class="w-3 h-3"></i>
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="flex flex-1 overflow-hidden gap-1.5" id="workspace">
      <!-- Left: Tools Panel -->
      <div
        class="card w-12 flex flex-col items-center py-1.5 gap-0.5 flex-shrink-0"
        id="tools-panel"
      >
        <!-- Populated by tools.js -->
      </div>

      <!-- Center: Single Canvas -->
      <div
        class="card card-raised flex-1 relative overflow-hidden bg-surface-0"
        id="canvas-area"
      >
        <!-- Landing -->
        <div
          id="landing"
          class="absolute inset-0 flex flex-col items-center justify-center bg-surface-0 z-10"
        >
          <h2 class="text-text-primary text-sm mb-1" data-i18n="landing.title">
            Manga Translation Editor
          </h2>
          <p class="text-text-muted text-xs mb-5" data-i18n="landing.subtitle">
            Import a page to begin
          </p>
          <button
            class="btn primary"
            id="btn-import-landing"
            data-i18n="landing.import"
          >
            Import Image
          </button>
        </div>

        <!-- Single Konva container -->
        <div id="canvas-container" class="absolute inset-0"></div>

        <!-- Page indicator -->
        <div
          id="page-indicator"
          class="absolute top-2 right-2 z-20 text-[0.65rem] text-text-muted hidden"
        ></div>

        <!-- Zoom controls -->
        <div id="zoom-controls" class="absolute bottom-2 left-2 z-20 hidden">
          <div
            class="flex items-center bg-surface-1 border border-surface-3 rounded overflow-hidden"
          >
            <button
              id="btn-zoom-out"
              class="zoom-btn"
              data-i18n-title="zoom.zoomOut"
            >
              <i data-lucide="minus" class="w-3 h-3"></i>
            </button>
            <span
              id="zoom-value"
              class="px-2 font-mono text-[0.65rem] text-text-secondary select-none"
              >100%</span
            >
            <button
              id="btn-zoom-fit"
              class="zoom-btn"
              data-i18n-title="zoom.fit"
            >
              <i data-lucide="maximize" class="w-3 h-3"></i>
            </button>
            <button
              id="btn-zoom-in"
              class="zoom-btn"
              data-i18n-title="zoom.zoomIn"
            >
              <i data-lucide="plus" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

        <!-- Progress overlay -->
        <div id="progress-overlay" class="overlay">
          <div
            class="text-text-secondary text-xs mb-2"
            id="progress-title"
            data-i18n="progress.processing"
          >
            Processing...
          </div>
          <div id="progress-steps"></div>
        </div>
      </div>

      <!-- Right: Sidebar -->
      <div
        class="card w-[260px] flex flex-col flex-shrink-0 overflow-hidden relative"
        id="sidebar"
      >
        <div class="sidebar-resize" id="sidebar-resize"></div>
        <div
          class="flex-1 min-h-0 flex flex-col overflow-hidden custom-scrollbar"
          id="sidebar-scroll"
        >
          <!-- Populated by sidebar.js -->
        </div>
      </div>
    </div>

    <!-- Page Strip -->
    <div
      id="page-strip"
      class="card h-[68px] flex-shrink-0 overflow-x-auto custom-scrollbar hidden"
    >
      <div
        id="page-strip-items"
        class="flex gap-1 p-1.5 h-full items-center"
      ></div>
    </div>

    <!-- Status Bar -->
    <div
      class="card flex items-center px-3 h-6 flex-shrink-0 text-[0.65rem] text-text-muted gap-3"
    >
      <span id="status-zoom">100%</span>
      <span class="w-px h-3 bg-surface-3"></span>
      <span id="status-tool" data-i18n="tools.selectName">Select</span>
      <span class="w-px h-3 bg-surface-3"></span>
      <span id="status-detections" data-i18n="status.noDetections"
        >No detections</span
      >
      <span class="ml-auto" id="status-page"></span>
    </div>

    <!-- Settings Modal (tab content built by lib/settings/) -->
    <div id="settings-overlay" class="overlay">
      <div
        class="card card-raised settings-modal flex flex-col overflow-hidden"
        id="settings-modal"
      >
        <div
          class="settings-titlebar flex items-center justify-between px-4 py-3 border-b border-surface-3"
          id="settings-titlebar"
        >
          <h3
            class="text-text-primary text-xs font-semibold"
            data-i18n="settings.title"
          >
            Settings
          </h3>
          <button class="btn p-1" id="btn-settings-close">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <!-- Nav + panes are built by settings.init() -->
        <div class="flex flex-1 min-h-0" id="settings-body">
          <div id="settings-tabbar" class="settings-nav"></div>
          <div
            id="settings-panes"
            class="flex flex-col flex-1 min-h-0 overflow-hidden"
          ></div>
        </div>
        <div class="flex justify-end gap-2 px-4 py-3 border-t border-surface-3">
          <button
            class="btn hidden"
            id="btn-shortcuts-reset-all"
            data-i18n="shortcuts.resetAll"
          >
            Reset All
          </button>
          <button
            class="btn primary"
            id="btn-settings-done"
            data-i18n="shortcuts.done"
          >
            Done
          </button>
        </div>
        <div
          class="settings-resize-grip"
          id="settings-resize-grip"
          title="Resize"
        >
          <i data-lucide="grip" class="w-3 h-3"></i>
        </div>
      </div>
    </div>

    <!-- Bundled renderer (esbuild output) -->
    <script src="../../../dist/renderer/bundle.js"></script>
  </body>
</html>
