name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skipped == 'false'
        run: npm ci

      - name: Build & bundle installer
        if: steps.check.outputs.skipped == 'false'
        env:
          # Signing deferred — no cert discovery in CI
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Create draft release
        if: steps.check.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRE=""
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/Lumina-Setup-DML-${{ steps.version.outputs.version }}.exe" \
            --repo "${{ github.repository }}" --draft $PRE --generate-notes \
            --title "Lumina v${{ steps.version.outputs.version }}"
